name: Build Netease iOS Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: netease-ios-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK, signature, package name and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          PACKAGE_INFO="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package:')"
          echo "$PACKAGE_INFO"
          [[ "$PACKAGE_INFO" == *"name='me.naptila.neteaseios'"* ]]
          mkdir -p dist
          OUTPUT="netease-ios-debug-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "dist/$OUTPUT"
          (cd dist && sha256sum "$OUTPUT" > "$OUTPUT.sha256")

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: netease-ios-debug-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
